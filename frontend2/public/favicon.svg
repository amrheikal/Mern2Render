<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tt-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- rounded chip body -->
  <rect x="14" y="14" width="36" height="36" rx="9" fill="url(#tt-grad)"/>
  <!-- chip pins -->
  <g stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round">
    <line x1="24" y1="6" x2="24" y2="14"/>
    <line x1="32" y1="6" x2="32" y2="14"/>
    <line x1="40" y1="6" x2="40" y2="14"/>
    <line x1="24" y1="50" x2="24" y2="58"/>
    <line x1="32" y1="50" x2="32" y2="58"/>
    <line x1="40" y1="50" x2="40" y2="58"/>
    <line x1="6" y1="24" x2="14" y2="24"/>
    <line x1="6" y1="32" x2="14" y2="32"/>
    <line x1="6" y1="40" x2="14" y2="40"/>
    <line x1="50" y1="24" x2="58" y2="24"/>
    <line x1="50" y1="32" x2="58" y2="32"/>
    <line x1="50" y1="40" x2="58" y2="40"/>
  </g>
  <!-- stylized "T" core -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="24" y1="26" x2="40" y2="26"/>
    <line x1="32" y1="26" x2="32" y2="40"/>
  </g>
  <circle cx="32" cy="32" r="20.5" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
